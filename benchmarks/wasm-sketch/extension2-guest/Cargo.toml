[package]
name = "kernal-extension2-guest-proof"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

[workspace]

[features]
# Explicit unfinished acceptance contract. This binary is expected to remain
# RED until the generated guest archive capability is implemented.
guest-proof = []
header-proof = ["guest-proof"]
auth-proof = ["guest-proof"]
inventory-proof = ["guest-proof"]

[[bin]]
name = "kernal-extension2-guest-proof"
path = "src/main.rs"
required-features = ["guest-proof"]

[dependencies]
# Migration-only source proof, not release-pin acceptance.
kernal-api = { version = "=0.1.0", path = "../../..", default-features = false }
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
