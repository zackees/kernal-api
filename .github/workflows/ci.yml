name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOLDR_SPEC: soldr==0.9.5
  # The assets branch is the authoritative SHA-pinned catalogue producer.
  # GitHub Pages currently serves its index but returns 404 for JSON payloads.
  SOLDR_TOOLCHAIN_ORIGIN: https://raw.githubusercontent.com/zackees/soldr-toolchain/assets

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Test command-policy guard
        run: >-
          uv run --no-project python -m unittest discover
          -s ci/hooks -p 'test_*.py'

  rust-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr cargo test --locked --all-features
      - run: >-
          uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr cargo clippy
          --locked --all-features --all-targets -- --deny warnings
      - run: uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr cargo fmt --all -- --check

  each-feature:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - allocator
          - conpty-sidecar
          - crash
          - fs
          - ipc
          - ipc-async
          - profile
          - pty
          - session-relay
          - snapshot
          - symbolize
          - symbolize-worker
          - tokio-console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: >-
          uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr cargo check
          --locked --no-default-features --features ${{ matrix.feature }}

  supported-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            legacy_cargo: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            legacy_cargo: true
          - os: macos-latest
            target: x86_64-apple-darwin
            legacy_cargo: false
          - os: macos-latest
            target: aarch64-apple-darwin
            legacy_cargo: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            legacy_cargo: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            legacy_cargo: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - if: matrix.legacy_cargo
        run: >-
          uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr cargo build
          --locked --target ${{ matrix.target }} --all-features
      - if: ${{ !matrix.legacy_cargo }}
        run: >-
          uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr build
          --target ${{ matrix.target }} --all-features

  dylints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: zackees/setup-soldr@882871241c9427b88686a8b1c358b4f3e8fdf2fb
        with:
          version: 0.9.5
          toolchain: 1.95.0
          cache: true
          build-cache: false
          prebuild-deps: none
          dylint: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
      - name: Select the pinned Dylint compiler
        shell: bash
        run: |
          rustc_path="$(uv run --no-project --with "${SOLDR_SPEC}" soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          echo "RUSTC=${rustc_path}" >> "${GITHUB_ENV}"
          echo "RUSTUP_TOOLCHAIN=nightly-2026-05-28" >> "${GITHUB_ENV}"
          chmod +x ci/dylint-shim/cargo
          echo "${GITHUB_WORKSPACE}/ci/dylint-shim" >> "${GITHUB_PATH}"
      - name: Test facade boundary lint
        env:
          ZCCACHE_DISABLE: "1"
        run: >-
          uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_boundary/Cargo.toml
      - name: Test platform boundary lint
        env:
          ZCCACHE_DISABLE: "1"
        run: >-
          uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_platform_boundary/Cargo.toml
      - name: Lint every client-style target
        env:
          ZCCACHE_DISABLE: "1"
        run: >-
          uv run --no-project --with "${{ env.SOLDR_SPEC }}" soldr cargo dylint
          --all --workspace -- --all-targets

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: >-
          uv run --no-project --python ${{ matrix.python }}
          --with-editable . --with pytest pytest python/tests
      - run: uv build --clear
      - run: uv run --no-project --python ${{ matrix.python }} --with twine twine check dist/*
