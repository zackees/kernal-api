# The minimal Linux and Dylint workflow lanes prove these checks. Extended/full
# mode and other native platforms still need their own successful local lanes.
# No remote job is mapped yet: linux also serves full mode, whose coverage this
# minimal lane cannot prove. Every remote check continues to run.
version: 1
gates:
  general/all/ci-guards: {lane: linux-minimal, fidelity: native}
  rust/x86_64-unknown-linux-gnu/default-facade-clippy: {lane: linux-minimal, fidelity: native}
  rust/x86_64-unknown-linux-gnu/default-facade-test: {lane: linux-minimal, fidelity: native}
  rust/all/dylint-all-features-all-targets: {lane: dylint-minimal, fidelity: native}
