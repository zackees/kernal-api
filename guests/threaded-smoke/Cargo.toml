[package]
name = "kernal-api-threaded-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

# This package deliberately owns its own workspace root. It is a source-only
# guest fixture and must never become a dependency or workspace member of the
# host facade.
[workspace]

[dependencies]
# Migration-only source pin for the public streaming proof. The generated
# dependency below remains solely for deliberate low-level ABI probes.
kernal-api = { version = "=0.1.0", path = "../..", default-features = false }
kernal-api-v1-bindings = { path = "../../src/wasm/generated/v1/guest" }
dashmap = "=6.1.0"
