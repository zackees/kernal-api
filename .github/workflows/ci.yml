name: CI

on:
  pull_request:
  # Retain a deterministic recovery path when GitHub drops or delays a
  # pull-request synchronize event for a draft branch. Manual dispatch runs
  # the exact same matrix at the explicitly selected ref.
  workflow_dispatch:
  push:
    branches: [main]

# One live run per workflow per ref, main included: a new push cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Main used to be exempt through a `github.run_id` group, which kept a CI
# record for every main commit -- at the cost of a full matrix per commit even
# when the next push landed seconds later. Two pushes four seconds apart held
# nine runners in `reld` while unrelated PRs queued. A superseded main commit
# now has no run of its own; its content is covered by the run for the commit
# that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  # The whole pipeline is four jobs. Each one is a runner that sets up once and
  # does everything that belongs on it, as steps -- not a runner per check.
  #
  #   linux          the gate: every Linux-only check and proof, then lint,
  #                  the full test suite, and the Wasm guests the hosts replay
  #   build (x5)     one Linux builder per other target: archive + proofs
  #   test (x5)      one host per other target: run what was built, compile nothing
  #   dylints (x2)   the boundary lints, on their own pinned nightly
  # Each job's last step cancels the run when that job fails (pull requests).
  #
  # This replaced 20 job definitions and 52 runners per push. Checks that used
  # to be a job each are now steps; the per-target proof matrices
  # (`native-proof-build`, `wasm-compiler-native`, `wasm-tauri-screenshot-native`)
  # folded into `build` and `test`, which already had one runner per target;
  # `supported-targets` compiled the same all-feature graph `build` archives,
  # so only its ABI-generator cross-check survived, as a `build` step.

  # Linux goes first and gates every other target. It compiles the same
  # sources they do, so a failure here is a failure everywhere, and holding
  # Apple and Windows runners to rediscover it is the waste this ordering
  # removes. On Linux the builder is the host, so everything runs in place,
  # on one runner: the Linux-only checks first, then lint and the full suite.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # `ci-tests: true` would otherwise default this to 1.
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Install native webview packages and a virtual display
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          dbus-x11 jq libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool
      # No restored crate registry here. This job compiles dozens of different
      # feature graphs, and a registry cache seeded by a job that needed only
      # part of the graph restores trimmed crate directories cargo trusts as
      # extracted: the first run on this shape failed all 36 feature checks at
      # `libc-0.2.189/src/unix/mod.rs: file not found`, from an 8,723-file
      # restore where the gate had restored 26,983. `dylints` guards against
      # the same thing with its own CARGO_HOME. Downloading sources costs a
      # minute; a poisoned registry costs the whole job.
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          ci-tests: true
          cache-key-suffix: linux
          prebuild-deps-flags: ""
          cargo-registry-cache: false
      - name: Restore native pkg-config search path
        run: |
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/${multiarch}/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - run: soldr cargo fmt --all -- --check
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Check the CI guards and the guest build scripts
        run: |
          uv run --no-project -m unittest \
            ci.test_native_proof ci.test_native_proof_jobs ci.test_macos_x64_guest \
            ci.test_nextest_config ci.test_deny_warnings
          bash tests/screenshot-build-arguments.sh
          bash tests/screenshot-target-repair.sh
          pwsh -NoProfile -File tests/screenshot-target-repair.ps1
      - name: Check the compilation boundary and the release tooling
        run: |
          uv run --no-project ci/check_compilation_boundary_dependencies.py
          uv run --no-project ci/test_release_package_features.py
          # tomllib needs Python >= 3.11, so this cannot share the package's
          # 3.10 floor; 3.12 is the runner's own interpreter.
          uv run --no-project --python 3.12 ci/test_auto_release.py
          uv run --no-project --python 3.12 ci/test_crate_release.py
      - name: Test the Python package
        # Python 3.10 only: it is the floor AGENTS.md supports, and the
        # package has no version-specific code for a second interpreter to
        # catch.
        run: |
          uv run --no-project --python 3.10 --with-editable . --with pytest pytest python/tests
          uv build --clear
          uv run --no-project --python 3.10 --with twine twine check dist/*
      # First compile in this job, deliberately. zccache restores a cached
      # build script without the materialize/spawn exclusion its miss path
      # has, so a busy daemon can fork a child that inherits the write fd
      # and the exec fails with ETXTBSY (zackees/zccache#1597). Run after the
      # 36 feature checks, this step hit it twice in a row; as a standalone
      # job, with a quiet daemon, it never did. This ordering is a
      # mitigation until #1597 is fixed, not a cure -- no job cap, no retry.
      - name: Verify checked-in guest, host, and ABI manifest generation
        run: |
          bash ci/check_wasm_abi_generation.sh
          soldr cargo test --locked --manifest-path tools/wasm-abi-generator/Cargo.toml
      # kernal-api-build is published from the same tag as the facade (see
      # ci/crate_release.py). Package and verify it on every pull request, so
      # a release never discovers a packaging failure after the facade is out.
      # Early, while the daemon is quiet: the verify build runs build scripts,
      # the case zackees/zccache#1597 fails with ETXTBSY under a busy daemon.
      - name: Package and verify the build-script companion
        run: uv run --no-project --python 3.12 ci/crate_release.py --package kernal-api-build package
      - name: Check every feature in isolation
        run: |
          set -uo pipefail
          features=(
            allocator
            archive
            archive-auth-test-support
            conpty-sidecar
            crash
            # The four daemon lanes are the frozen running-process substrates.
            # Without them these features are compiled only inside
            # `--all-features` in `test-archive`, where every other feature is
            # present to supply whatever a missing gate would need -- exactly
            # the coupling this matrix exists to catch.
            daemon-frame-v1
            daemon-identity
            daemon-registration
            daemon-registration-v2
            fs
            fs-watch
            hash-sha256
            secure-random
            text-similarity
            command-arguments
            config-toml
            json
            source-cpp
            terminal-style
            terminal-input
            event-stream
            http-server
            http-client
            # Canonical scheduler/broker spawn API is public only through this
            # feature. Keep it isolated from the default process HAL.
            independent-spawn
            ipc
            ipc-async
            profile
            pty
            session-relay
            snapshot
            symbolize
            symbolize-split
            symbolize-worker
            tokio-console
            tauri-webview
            window-icon
          )
          failed=()
          for feature in "${features[@]}"; do
            echo "::group::${feature}"
            if ! soldr cargo check --locked --no-default-features --features "${feature}"; then
              failed+=("${feature}")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::features that do not compile in isolation: ${failed[*]}"
            exit 1
          fi
      - name: Test JSON with unified arbitrary-precision backend feature
        run: >-
          soldr cargo test --locked --no-default-features
          --features json,serde_json/arbitrary_precision --test data
      - name: Verify HTTP wire semantics under backend feature unification
        # Resolves a backend feature outside the production graph, so it may
        # update the lockfile and cannot run `--locked`.
        run: >-
          soldr cargo test --features http-client,reqwest/gzip
          --test net http_client::encoded_responses_preserve_wire_bytes_and_headers
      - name: Check the external daemon-registration consumers
        run: |
          soldr cargo check --locked --manifest-path tests/daemon-registration-consumer/Cargo.toml
          soldr cargo check --locked --manifest-path tests/daemon-registration-v2-consumer/Cargo.toml
      - name: Build the source-only threaded guest and validate root execution
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kernal-api-threaded-smoke
        run: bash scripts/build-threaded-smoke.sh
      - name: Run real semantic webview lifecycle and capture proofs
        # A unit test does not own process main on every harness, while Tauri
        # needs its event loop there, so these run the smoke binary under Xvfb.
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- close
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- bootstrap
          # Expand fixture variables inside the child Bash, not this step shell.
          # shellcheck disable=SC2016
          dbus-run-session -- xvfb-run -a bash -c '
            soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- popup & proof=$!;
            for _ in $(seq 1 50); do window=$(xdotool search --name "kernal-api external-content proof" | head -1 || true); [ -n "$window" ] && break; sleep 0.1; done;
            test -n "$window"; sleep 1; xdotool mousemove --window "$window" 150 150 click 1; wait "$proof"'
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- redirect
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- timeout
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- cancel
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- window-close
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- capture
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- capture-cancel
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- open-cancel
          dbus-run-session -- xvfb-run -a soldr cargo test --locked --features tauri-webview --lib live_webkit_viewport_png_completes_capture_operation -- --ignored --test-threads=1
      - name: Install the screenshot guest target
        run: uv run --no-project ci/native_proof.py wasm-target wasm32-wasip1-threads
      - name: Build, admit, and run the real guest through the default screenshot CLI
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          KERNAL_API_SCREENSHOT_PROOF_DIR: ${{ runner.temp }}/kernal-api-screenshot-proof
        run: |
          # The CLI starts Soldr itself. Finish the outer Soldr invocation
          # before running the harness; never disable its reentry guard.
          test_executable="$(soldr cargo test --locked --features wasm-sketch-worker,tauri-webview-test-support --test wasm_tauri_screenshot --no-run --message-format=json |
            jq -er -s '[.[] | select(.reason == "compiler-artifact" and .target.name == "wasm_tauri_screenshot" and .profile.test == true and .executable != null)] | if length == 1 then .[0].executable else error("expected exactly one screenshot test executable") end')"
          dbus-run-session -- xvfb-run -a "$test_executable" default_screenshot_cli_uses_containment_and_commits_output --exact --ignored --nocapture --test-threads=1 | tee "$RUNNER_TEMP/screenshot-cli.log"
          grep -F "test result: ok. 1 passed; 0 failed;" "$RUNNER_TEMP/screenshot-cli.log"
      # The x86_64 Linux native proofs, built and run in place: here the
      # builder is the host. Every other target builds in `build` and runs in
      # `test`.
      # Built once: the x86_64 Linux native proofs below use them in place, and
      # every other host's `test` job downloads them.
      - name: Build the target-independent Wasm guests once
        run: >-
          uv run --no-project ci/native_proof.py guests
          --out "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-guest-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-proof-guests
          path: ${{ runner.temp }}/native-proof-guests
          if-no-files-found: error
          retention-days: 1
      - name: Compile the x86_64 Linux native proofs
        run: >-
          uv run --no-project ci/native_proof.py build --target x86_64-unknown-linux-gnu
          --archive "${{ runner.temp }}/native-proof-x86_64-unknown-linux-gnu.tar"
          --work "${{ runner.temp }}/native-proof-build"
      - name: Run the x86_64 Linux compiler-policy proofs
        timeout-minutes: 20
        run: >-
          uv run --no-project ci/native_proof.py run compiler
          --native-target x86_64-unknown-linux-gnu
          --bundle "${{ runner.temp }}/native-proof-x86_64-unknown-linux-gnu.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-compiler"
      - name: Run the x86_64 Linux screenshot and containment proofs
        timeout-minutes: 30
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          KERNAL_API_SCREENSHOT_PROOF_DIR: ${{ runner.temp }}/kernal-api-screenshot-proof
        run: >-
          uv run --no-project ci/native_proof.py run screenshot
          --native-target x86_64-unknown-linux-gnu
          --bundle "${{ runner.temp }}/native-proof-x86_64-unknown-linux-gnu.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-screenshot"
      - name: Lint every target
        run: >-
          soldr cargo clippy
          --locked --all-features --all-targets -- --deny warnings
      - name: Run the full test suite
        # One test per process. `--no-fail-fast` is about tests, not runners:
        # the suite is about thirty seconds of tests, so stopping at the first
        # failure saved no capacity and hid the rest until the next cycle.
        run: soldr cargo nextest run --locked --all-features --no-fail-fast
      - name: Preserve screenshot and process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-screenshot-diagnostics
          path: ${{ runner.temp }}/kernal-api-screenshot-proof
          if-no-files-found: warn
      # Last step: a failure anywhere in this job stops the whole run, so a
      # red push releases its runners instead of finishing jobs that no longer
      # matter. A step, not a sentinel job: a job that `needs` the others
      # starts only when all of them finish, which is too late to cancel
      # anything. Pull requests only: on main a cancelled run would erase the
      # record of which job failed.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request'
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Every other target, compiled on Linux: the scarce Apple and Windows
  # runners in `test` only ever execute what these builders produce.
  build:
    name: Build (${{ matrix.target }})
    needs: linux
    strategy:
      # Every target compiles the same sources; the second failure teaches
      # nothing the first did not.
      fail-fast: true
      matrix:
        include:
          # aarch64 Linux builds natively on an ARM runner, so WebKitGTK uses
          # the distribution's own ABI instead of a cross sysroot.
          - builder: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: ""
          - builder: ubuntu-24.04
            target: x86_64-apple-darwin
            cross: x86_64-apple-darwin
          - builder: ubuntu-24.04
            target: aarch64-apple-darwin
            cross: aarch64-apple-darwin
          - builder: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            cross: x86_64-pc-windows-msvc
          - builder: ubuntu-24.04
            target: aarch64-pc-windows-msvc
            cross: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.builder }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Install native webview development packages
        if: matrix.cross == ''
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          ci-tests: true
          cache-key-suffix: build-${{ matrix.target }}
          cross-targets: ${{ matrix.cross }}
          prebuild-deps-flags: ${{ matrix.cross && format('--target {0}', matrix.cross) || '' }}
      - name: Restore native pkg-config search path
        if: matrix.cross == ''
        run: |
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          target="${{ matrix.target }}"
          # Only the variable NAME takes underscores; the path keeps hyphens.
          echo "PKG_CONFIG_LIBDIR_${target//-/_}=/usr/lib/${multiarch}/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      # A native lane (`cross` empty) builds for the host WITHOUT `--target`:
      # naming the triple makes Soldr link through a zig shim the runner does
      # not carry. Clippy never links, so only the archive would notice.
      - name: Lint this target
        run: >-
          soldr cargo clippy
          --locked --all-features --all-targets
          ${{ matrix.cross && format('--target {0}', matrix.cross) || '' }}
          -- --deny warnings
      # Windows keeps debug info in a `.pdb` beside the `.exe`, and nextest
      # archives the executable without it; `kernal-symbolize`'s tests read
      # their own binary's PDB. `archive.include` takes paths, not globs, and
      # the name carries a build hash, so build first, name the PDB, archive
      # with it. Only that one: `deps` is half a gigabyte for one binary.
      - name: Archive every test binary for this target
        shell: bash
        run: |
          set -euo pipefail
          target_args=()
          if [ -n "${{ matrix.cross }}" ]; then
            target_args=(--target "${{ matrix.cross }}")
          fi
          config_args=()
          if [[ "${{ matrix.target }}" == *-pc-windows-msvc ]]; then
            soldr cargo test --locked --all-features "${target_args[@]}" --no-run
            shopt -s nullglob
            pdbs=(target/${{ matrix.target }}/debug/deps/kernal_symbolize-*.pdb)
            if [ "${#pdbs[@]}" -eq 0 ]; then
              echo "::error::the kernal-symbolize test build produced no PDB"
              exit 1
            fi
            cp .config/nextest.toml "${RUNNER_TEMP}/nextest-archive.toml"
            {
              echo
              echo "[profile.default.archive]"
              echo "include = ["
              for pdb in "${pdbs[@]}"; do
                echo "  { path = \"${pdb#target/}\", relative-to = \"target\", on-missing = \"error\" },"
              done
              echo "]"
            } >> "${RUNNER_TEMP}/nextest-archive.toml"
            config_args=(--config-file "${RUNNER_TEMP}/nextest-archive.toml")
          fi
          soldr cargo nextest archive \
            --locked --all-features "${target_args[@]}" "${config_args[@]}" \
            --archive-file "kernal-tests-${{ matrix.target }}.tar.zst"
      - name: Compile the explicit ABI generator for this target
        # The one check `supported-targets` made that the archive does not.
        run: >-
          soldr cargo check --locked
          --manifest-path tools/wasm-abi-generator/Cargo.toml
          ${{ matrix.cross && format('--target {0}', matrix.cross) || '' }}
      - name: Build the native webview smoke binary
        if: endsWith(matrix.target, '-pc-windows-msvc')
        run: >-
          soldr cargo build
          --locked --all-features --target ${{ matrix.target }}
          --bin kernal-tauri-smoke
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Compile every native proof binary for this target
        run: >-
          uv run --no-project ci/native_proof.py build --target ${{ matrix.target }}
          --archive "${{ runner.temp }}/native-proof-${{ matrix.target }}.tar"
          --work "${{ runner.temp }}/native-proof-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernal-tests-${{ matrix.target }}
          path: |
            kernal-tests-${{ matrix.target }}.tar.zst
            target/${{ matrix.target }}/debug/kernal-tauri-smoke.exe
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-proof-${{ matrix.target }}
          path: ${{ runner.temp }}/native-proof-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1
      # Stops the whole run on a failure here; see the step in `linux`.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request'
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Run each target's prebuilt binaries on its own host. Nothing here compiles.
  test:
    name: Test (${{ matrix.target }})
    needs: [linux, build]
    strategy:
      # One host's failure stops the others; a host-specific failure is
      # reproduced by re-running this job alone.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Install the native webview runtime and a virtual display
        # The binaries link webkit2gtk at run time, and the screenshot proofs
        # need a display. Windows and macOS carry their webviews with the OS.
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          dbus-x11 libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernal-tests-${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-proof-guests
          path: ${{ runner.temp }}/native-proof-guests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-proof-${{ matrix.target }}
          path: ${{ runner.temp }}/native-proof-bundle
      # The test-suite replay stays behind `ENABLE_MACOS_RUNNERS` on Apple
      # hosts, as it was; the proofs below run on every host, as they did.
      - name: Install cargo-nextest
        if: ${{ !startsWith(matrix.os, 'macos') || vars.ENABLE_MACOS_RUNNERS == 'true' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.cargo/bin"
          # Pick by OS *and* architecture. The bare `linux` and `windows`
          # builds are x86-64: on the ARM runners they fail with `Exec format
          # error` before a single test starts. `mac` is universal.
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) url=https://get.nexte.st/latest/linux ;;
            Linux-ARM64) url=https://get.nexte.st/latest/linux-arm ;;
            Windows-X64) url=https://get.nexte.st/latest/windows ;;
            Windows-ARM64) url=https://get.nexte.st/latest/windows-arm ;;
            macOS-*) url=https://get.nexte.st/latest/mac ;;
            *) echo "no cargo-nextest build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -LsSf "$url" -o nextest.zip && unzip -o -q nextest.zip -d "$HOME/.cargo/bin"
          else
            curl -LsSf "$url" | tar zxf - -C "$HOME/.cargo/bin"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run this host's prebuilt tests
        if: ${{ !startsWith(matrix.os, 'macos') || vars.ENABLE_MACOS_RUNNERS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # An array, not a string: the filter expression is one argument and
          # word-splitting would hand nextest `not` and `binary(...)` as two.
          filter=()
          if [ "${{ runner.os }}" != "Linux" ]; then
            filter=(-E 'not binary(source_policy)')
          fi
          set -o pipefail
          cargo-nextest nextest run \
            --archive-file "kernal-tests-${{ matrix.target }}.tar.zst" \
            --workspace-remap . --no-fail-fast "${filter[@]}" 2>&1 | tee nextest-output.txt
      - name: Prove this host ran its own code
        if: ${{ !startsWith(matrix.os, 'macos') || vars.ENABLE_MACOS_RUNNERS == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) marker="platform_linux::" ;;
            macOS) marker="platform_macos::" ;;
            Windows) marker="platform_win::" ;;
          esac
          grep -F "${marker}" nextest-output.txt > /dev/null \
            || { echo "no ${marker} test ran: this host did not execute its own code"; exit 1; }
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Run actual Core and Component compiler-policy guest proofs
        timeout-minutes: 20
        shell: bash
        run: >-
          uv run --no-project ci/native_proof.py run compiler
          --native-target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-proof-bundle/native-proof-${{ matrix.target }}.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-compiler"
      - name: Configure screenshot proof storage
        shell: pwsh
        run: |
          "KERNAL_API_SCREENSHOT_PROOF_DIR=$(Join-Path $env:RUNNER_TEMP 'kernal-api-screenshot-proof')" >> $env:GITHUB_ENV
      - name: Ensure Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Microsoft's documented Evergreen Runtime keys, not the Edge browser.
          function Get-WebViewRuntimeVersion {
            foreach ($key in @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')) {
              $value = (Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue).pv
              $parsed = $null
              if ([version]::TryParse($value, [ref]$parsed) -and $parsed -gt [version]'0.0.0.0') { return $value }
            }
            return $null
          }
          if (-not (Get-WebViewRuntimeVersion)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'Valid') { throw 'Invalid WebView2 installer signature' }
            $installation = Start-Process -FilePath $installer -ArgumentList '/silent','/install' -Wait -PassThru
            if ($installation.ExitCode -ne 0) { throw "WebView2 installation failed: $($installation.ExitCode)" }
          }
          if (-not (Get-WebViewRuntimeVersion)) { throw 'WebView2 Runtime is unavailable after setup' }
          Write-Output "WebView2 Runtime: $(Get-WebViewRuntimeVersion)"
      - name: Run offline native Wasm screenshot, admission, and worker containment proofs
        timeout-minutes: 30
        shell: bash
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: >-
          uv run --no-project ci/native_proof.py run screenshot
          --native-target ${{ matrix.target }}
          --bundle "${{ runner.temp }}/native-proof-bundle/native-proof-${{ matrix.target }}.tar"
          --guests "${{ runner.temp }}/native-proof-guests"
          --work "${{ runner.temp }}/native-proof-run-screenshot"
      # The WebView2 proofs need a real Windows host, from a binary built on
      # Linux (#270, #273).
      - name: Verify native Windows external-page isolation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: target/x86_64-pc-windows-msvc/debug/kernal-tauri-smoke.exe close
      - name: Verify native Windows page bootstrap
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: target/x86_64-pc-windows-msvc/debug/kernal-tauri-smoke.exe bootstrap
      - name: Verify native Windows interactive window lifetime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: target/x86_64-pc-windows-msvc/debug/kernal-tauri-smoke.exe window-close
      - name: Preserve screenshot and process diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/kernal-api-screenshot-proof
          if-no-files-found: warn
      # Stops the whole run on a failure here; see the step in `linux`.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request'
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # A Dylint pass only sees what the compiler compiles, so `cfg(target_os =
  # "macos")` bodies are invisible on a Linux host, which is how a raw host type
  # reached a public signature while both guards reported clean (#147).
  # `macos-15-intel` closes that half: the lint now runs where those bodies are
  # compiled.
  #
  # Windows is the other half, and is deliberately absent. `soldr cargo dylint`
  # cannot run there at all: Soldr rejects its own managed `dylint-link` through
  # a generic `--version`/`--help` probe that a working link wrapper cannot pass
  # (it forwards the flags to `link.exe`), so the job exits 1 before compiling
  # anything (zackees/soldr#3274). Verified on this branch -- `windows-2025`
  # failed in 6m4s on that diagnostic while macOS passed.
  #
  # When that lands, add `windows-2025` back *and* a `ci/dylint-shim/cargo.cmd`
  # beside the existing script: Windows resolves a bare `cargo` through PATHEXT
  # and would skip the extensionless shim, silently re-entering soldr.
  #
  # This is the option #147 recommends, and it costs the extra job the issue
  # acknowledges. It runs counter to #270's direction of moving work off Apple
  # runners, so it is a deliberate trade of runner minutes for coverage of the
  # host-selected code rather than an oversight.
  dylints:
    # Gated on Linux: the `macos-15-intel` entry is the single most expensive
    # job in this workflow, and a lint finding is not worth an Apple runner
    # while the tests are red.
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native webview development packages
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          toolchain: 1.95.0
          cache: true
          build-cache: false
          prebuild-deps: none
          dylint: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
      - name: Restore native pkg-config search path
        if: runner.os == 'Linux'
        run: echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - name: Select the pinned Dylint compiler
        shell: bash
        run: |
          rustc_path="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          echo "RUSTC=${rustc_path}" >> "${GITHUB_ENV}"
          echo "RUSTUP_TOOLCHAIN=nightly-2026-05-28" >> "${GITHUB_ENV}"
          chmod +x ci/dylint-shim/cargo
          echo "${GITHUB_WORKSPACE}/ci/dylint-shim" >> "${GITHUB_PATH}"
      - name: Test facade boundary lint
        env:
          # Do not trust a partially restored global crates.io source tree.
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_boundary/Cargo.toml
      - name: Test platform boundary lint
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_platform_boundary/Cargo.toml
      # A Dylint pass only sees what the compiler compiles, and `default = []`.
      # Without `--all-features` every gated module -- `crash`, `wasm`,
      # `symbolize`, `profile`, `fs`, `ipc`, the platform watchers -- is invisible
      # to the boundary lints, so a green job would mean nothing beyond the
      # ungated core. Keep both flags: features widen the module set, targets
      # widen it to the integration tests and the two worker binaries.
      - name: Lint every client-style target
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr cargo dylint
          --all --workspace -- --all-features --all-targets
      # Stops the whole run on a failure here; see the step in `linux`.
      - name: Cancel the run (this job failed)
        if: failure() && github.event_name == 'pull_request'
        # No checkout guaranteed, so `gh` cannot infer the repository.
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
