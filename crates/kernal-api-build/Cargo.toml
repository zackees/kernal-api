[package]
name = "kernal-api-build"
version = "0.1.9"
edition = "2021"
rust-version = "1.95.0"
description = "Build-script companion to kernal-api: Windows executable resources"
license = "BSD-3-Clause"
repository = "https://github.com/zackees/kernal-api"
homepage = "https://github.com/zackees/kernal-api"
keywords = ["build-dependencies", "windows", "resources", "icon", "manifest"]
categories = ["development-tools::build-utils"]

[lib]
name = "kernal_api_build"
path = "src/lib.rs"

# A separate package, not a kernal-api feature: Cargo links a build script's
# resources only into the binaries of the package that runs the script, and a
# `dep-name/feature-name` entry in an application's feature table applies to
# every dependency of that name, including its build-dependency. A feature on
# kernal-api therefore dragged the application's runtime capabilities -- Tauri,
# GTK, glib -- into the host build script. This package depends only on the
# resource compiler, so a build script pays for nothing else.
[dependencies]
embed-resource = "=3.0.11"
