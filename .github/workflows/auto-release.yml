name: Auto-Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA to release or dry-run
        required: true
        type: string
      full_ci_run_id:
        description: Successful exact-SHA full CI run ID (required to publish)
        required: false
        type: string
      dry_run:
        description: Verify and upload build artifacts without publishing anything
        type: boolean
        default: true

permissions:
  contents: write
  # release.yml's jobs cancel the run when one fails; a called workflow gets
  # no more than its caller grants.
  actions: write

concurrency:
  group: kernal-api-release
  cancel-in-progress: false

jobs:
  prepare:
    # Explicit dispatch is the only release entry point.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}
      - name: Verify selected source SHA
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Detect version bump
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: uv run --no-project --python 3.13 ci/auto_release.py

  full-ci-gate:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Verify exact-SHA full CI passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_CI_RUN_ID: ${{ inputs.full_ci_run_id }}
        run: uv run --no-project --python 3.12 ci/release_ci_gate.py

  release:
    needs: [prepare, full-ci-gate]
    if: >-
      always() && needs.prepare.outputs.should_release == 'true'
      && (inputs.dry_run || needs.full-ci-gate.result == 'success')
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ inputs.candidate_sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      full_ci_run_id: ${{ inputs.full_ci_run_id }}
    secrets: inherit

  publish-crates:
    # Here, in the top-level workflow, rather than in release.yml: this is
    # the workflow registered as the crate's trusted publisher. `release`
    # completing means every release.yml job -- guard, validation,
    # packaging, GitHub assets -- succeeded.
    needs: [prepare, full-ci-gate, release]
    if: >-
      needs.prepare.outputs.should_release == 'true'
      && !inputs.dry_run
      && needs.full-ci-gate.result == 'success'
      && vars.PUBLISH_CRATES_IO == 'true'
    runs-on: ubuntu-latest
    environment: release
    # crates.io trusted publishing: no stored token. The job exchanges its
    # GitHub OIDC token for a short-lived crates.io token, which crates.io
    # grants only to `zackees/kernal-api`'s `auto-release.yml`.
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      # As in release.yml, so re-packaging reproduces the validated .crate.
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          lfs: true
      - uses: zackees/setup-soldr@c2a3b964193132387c564430eb7d295af0a6d021 # v0.9.77
        with:
          # A release restores nothing. Every cache is a key that another job
          # can write -- the v0.1.14 aarch64 worker restored a toolchain whose
          # rustup records listed an aarch64 std that the saved archive did not
          # contain, and failed at E0463. Build from sources and releases only.
          cache: false
          build-cache: false
          # Not covered by `cache: false`: the toolchain cache is separate.
          solo-toolchain-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-packages
          path: release-packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conpty-sidecars
          path: conpty-sidecars
      - name: Stage validated ConPTY manifest for publishing
        shell: bash
        run: cp conpty-sidecars/conpty-sidecar.sha256.toml conpty-sidecar.sha256.toml
      - name: Exchange the OIDC token for a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Publish or verify identical crates.io artifact
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # Uploads only the validated artifact's exact bytes; see the script.
        run: >-
          uv run --no-project --python 3.12 ci/crate_release.py publish
          "release-packages/kernal-api-${TAG#v}.crate"
      # A failed release job stops the whole release run.
      - name: Cancel the run (this job failed)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
