name: macOS x86_64 tests

# Intel macOS test execution on GitHub-hosted Linux runners.
#
# The product is cross-compiled on Linux through Soldr's own toolchain (bundled
# LLVM plus the managed macOS SDK) and only *executed* in a macOS guest, so the
# guest needs no Rust toolchain, no Xcode CLT and no Homebrew -- just a Mach-O
# `cargo-nextest`, which is fetched from nextest's own release and shipped in
# through the action's share directory. Verified payload: a universal
# (x86_64 + arm64) Mach-O, `cf fa ed fe` fat header, sha256-checked on staging.
#
# Why this exists: ci.yml's `test-run` covers aarch64 and x86_64 macOS from
# prebuilt archives, but both Apple entries are gated off by
# `ENABLE_MACOS_RUNNERS`. The Apple-hosted matrices
# in ci.yml execute the compiler-policy and screenshot proofs, not the test
# suite. So x86_64-apple-darwin was built and its unit tests ran nowhere,
# leaving the `target_arch` branches in src/snapshot/unwind.rs and
# src/crash/mod.rs -- and src/snapshot/macos.rs -- unverified on Intel. On
# macOS the two arches differ in thread-state structs (`x86_THREAD_STATE64` vs
# `ARM_THREAD_STATE64`), register sets, and frame-pointer conventions.
#
# Why a Recovery guest, not a prebaked image: this lane previously pulled a
# hand-baked `dockur/macos` image from this repository's own GHCR namespace.
# That image was never published -- the `macos-x64-bake.yml` workflow the old
# comment named has never existed in this repository -- and producing it needed
# a 30-60 minute manual macOS install plus a 128 GB volume published by hand.
# Every run since this workflow landed failed at `guest.sh start` with
# `manifest unknown`. `zackees/docker-mac-x64` boots a real x86_64 macOS
# Recovery guest under QEMU/KVM with no baked image, no SSH secret and no GHCR
# login, which removes that entire dependency class.
#
# Advisory by design: nightly and on demand, never a required check and never a
# release gate -- the cadence the suppressed Apple lanes were built for.

on:
  schedule:
    # Nightly. Boot plus a two-core guest makes this a correctness gate, not a
    # per-PR loop.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      filter:
        description: 'extra nextest filter expression (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel-macos-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          cache: false
          cross-targets: x86_64-apple-darwin

      - name: Cross-build Intel test binaries on Linux
        run: ci/macos-x64/build-archive.sh

      # The action serves this directory to the guest at http://10.0.2.2:8000/.
      # Everything the guest executes must be staged here: the archive, the
      # Mach-O cargo-nextest matched to the version that built it, and the
      # optional operator filter.
      - name: Stage the guest share directory
        env:
          NEXTEST_FILTER: ${{ inputs.filter }}
        run: ci/macos-x64/stage-guest-share.sh

      # Recovery boots exactly one script and offers no per-command execution,
      # so the guest half has to travel as a single string. Handing it to the
      # action through a step output keeps ci/macos-x64/recovery-guest.sh a
      # reviewable file rather than an inline heredoc.
      - name: Generate the Recovery guest script
        id: guest_script
        run: |
          {
            echo 'script<<KERNAL_GUEST_SCRIPT_EOF'
            cat ci/macos-x64/recovery-guest.sh
            echo 'KERNAL_GUEST_SCRIPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # The action installs the KVM udev rule and reclaims runner disk itself,
      # so this job needs neither step. Timeouts are raised well above the
      # action's smoke-only defaults because this guest replays a real nextest
      # partition rather than running `--version`.
      - name: Run the tests in a macOS Recovery guest
        id: macos
        uses: zackees/docker-mac-x64@f173a047ba7fbe1db7d8162ff3ac8e276f50b153 # main
        with:
          share-dir: share
          collect: /tmp/results
          ram: "10"
          cores: "2"
          threads: "4"
          boot-timeout: "1200"
          run-timeout: "3600"
          no-progress-timeout: "1200"
          run: ${{ steps.guest_script.outputs.script }}

      # The guest never exits non-zero, so a missing step would silently pass
      # the job. This is the gate, and it is also where the Intel-coverage
      # assertion lives: it fails a green run that executed no x86_64-only
      # tests.
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Verify the collected guest results
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-project ci/macos-x64/verify-guest-results.py
          --collected "${{ steps.macos.outputs.workdir }}/collected"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload guest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-x64-guest-diagnostics
          path: ${{ steps.macos.outputs.workdir }}/collected/
          if-no-files-found: warn
          retention-days: 7
