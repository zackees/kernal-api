[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kernal-api"
version = "0.1.0"
description = "Async OS HAL, profiling, symbolization, and allocator instrumentation"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Zackees" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/zackees/kernal-api"
Repository = "https://github.com/zackees/kernal-api"
Issues = "https://github.com/zackees/kernal-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/kernal_api"]

[tool.hatch.build.targets.sdist]
include = [
  "/COMPATIBILITY.md",
  "/PROTOCOLS.md",
  "/python",
  "/LICENSE",
  "/README.md",
]
