[package]
name = "kernal-component-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

[workspace]

[features]
default = []
engine-probe = ["dep:wasmtime"]
execution-probe = ["engine-probe", "dep:kernal-api"]

[dependencies]
anyhow = "=1.0.104"
wit-component = "=0.251.0"
wasmparser = "=0.251.0"
kernal-api = { version = "=0.1.0", path = "../../..", default-features = false, optional = true }
wasmtime = { version = "=45.0.0", optional = true, default-features = false, features = ["cranelift", "runtime", "component-model", "component-model-async"] }

[dev-dependencies]
zccache-compiler = { git = "https://github.com/zackees/zccache", rev = "c6ddfa974a4920a127eac81773db6a5c56cd30a7", default-features = false }
wasm-encoder = "=0.251.0"
