[package]
name = "kernal_api_platform_boundary"
version = "0.1.0"
description = "Keep client host-platform selection inside kernal-api"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.0.3"

[dev-dependencies]
dylint_testing = "=6.0.3"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]

[profile.release]
opt-level = 0
lto = false
codegen-units = 16
strip = "none"
