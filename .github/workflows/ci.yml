name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  rust-native:
    strategy:
      fail-fast: false
      # macOS is deliberately absent. Apple compilation happens on Linux
      # through Soldr's cross toolchain; `macos-arm-tests` below runs the
      # aarch64 tests from a prebuilt archive, so the Apple runner is held
      # only for the execution window rather than for a full compile.
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      # `--all-features` now includes the opt-in raw Wry backend.  Keep its
      # GTK/WebKit headers out of ordinary/default builds, but install them
      # before this deliberately heavyweight Linux lane compiles it.
      - name: Install native webview development packages
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - name: Restore native pkg-config search path
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - run: soldr cargo test --locked --all-features
      - run: >-
          soldr cargo clippy
          --locked --all-features --all-targets -- --deny warnings
      - run: soldr cargo fmt --all -- --check
      - name: Build native Windows external-page isolation proof
        if: runner.os == 'Windows'
        run: >-
          soldr cargo build --locked --all-features
          --bin kernal-tauri-smoke
      - name: Verify native Windows external-page isolation
        if: runner.os == 'Windows'
        # Let Cargo resolve Soldr's actual binary path. Keep the feature graph
        # identical to the preceding build, allowing time for cache recovery.
        timeout-minutes: 15
        run: >-
          soldr cargo run --locked --all-features
          --bin kernal-tauri-smoke -- close
      - name: Verify HTTP wire semantics under backend feature unification
        # Run after locked checks: this deliberately resolves a backend feature
        # outside our manifest's production graph and may update the lockfile.
        run: >-
          soldr cargo test --features http-client,reqwest/gzip
          --test http_client encoded_responses_preserve_wire_bytes_and_headers

  # Compile the aarch64-apple-darwin test binaries on Linux. Nothing here
  # needs a Mac: Soldr carries its own LLVM and macOS SDK, and clippy is a
  # compile-time check that runs fine against a cross target.
  macos-arm-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          cache: false
          cross-targets: aarch64-apple-darwin
      - run: >-
          soldr cargo clippy
          --locked --all-features --all-targets
          --target aarch64-apple-darwin -- --deny warnings
      - run: >-
          soldr cargo nextest archive
          --target aarch64-apple-darwin --all-features
          --archive-file kernal-arm64.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernal-arm64-tests
          path: kernal-arm64.tar.zst
          retention-days: 1

  # This job does not compile. It unpacks prebuilt Mach-O test binaries and
  # runs them, so the 10x-billed Apple hardware is held for the test duration
  # and nothing else. (`threaded-rust-artifact` still builds on macOS; it is
  # an execution smoke test for the host wasm path rather than a
  # cross-compilation lane, so it is left alone here.)
  # Suppressed by default. Apple-hosted runners are held off until the
  # repository variable `ENABLE_MACOS_RUNNERS` is set to `true`; the job stays
  # defined and reports as skipped, so re-enabling is a variable flip rather
  # than a workflow edit. `macos-arm-archive` above still runs on Linux, so the
  # aarch64-apple-darwin clippy and test-archive coverage is unaffected.
  macos-arm-tests:
    needs: macos-arm-archive
    if: vars.ENABLE_MACOS_RUNNERS == 'true'
    runs-on: macos-latest
    steps:
      # The workspace is still needed: tests that resolve paths relative to
      # the manifest directory are remapped onto this checkout below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernal-arm64-tests
      - name: Install cargo-nextest
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -LsSf https://get.nexte.st/latest/mac \
            | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run the aarch64 tests from the prebuilt archive
        # `cargo-nextest` is a cargo subcommand shim: invoked directly it
        # still expects `nextest` as its first argument, otherwise it parses
        # the next token as a cargo subcommand and fails.
        #
        # The excluded binaries are source-inspection policy tests: they read
        # this crate's own source through `env!("CARGO_MANIFEST_DIR")`, which
        # is baked in at compile time and therefore still points at the Linux
        # builder's path. `--workspace-remap` cannot rewrite a compile-time
        # constant. Nothing is lost by skipping them here -- they assert on
        # source text, which is identical on every host, and `rust-native
        # (ubuntu-latest)` already runs them. A new policy test of this shape
        # will fail this lane loudly until it is added to the list.
        run: >-
          cargo-nextest nextest run
          --archive-file kernal-arm64.tar.zst
          --workspace-remap .
          -E 'not (binary(daemon_frame_v1) or binary(daemon_identity)
          or binary(version_policy) or binary(facade_policy))'

  each-feature:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - allocator
          - archive
          - conpty-sidecar
          - crash
          # The four daemon lanes are the frozen running-process substrates.
          # Without them these features are compiled only inside
          # `--all-features` on `rust-native`, where every other feature is
          # present to supply whatever a missing gate would need -- exactly
          # the coupling this matrix exists to catch.
          - daemon-frame-v1
          - daemon-identity
          - daemon-registration
          - daemon-registration-v2
          - fs
          - fs-watch
          - hash-sha256
          - secure-random
          - text-similarity
          - event-stream
          - http-server
          - http-client
          - ipc
          - ipc-async
          - profile
          - pty
          - session-relay
          - snapshot
          - symbolize
          - symbolize-split
          - symbolize-worker
          - tokio-console
          - tauri-webview
          - window-icon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native webview development packages
        if: matrix.feature == 'tauri-webview'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - name: Restore native pkg-config search path
        if: matrix.feature == 'tauri-webview'
        run: echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - run: >-
          soldr cargo check
          --locked --no-default-features --features ${{ matrix.feature }}

  # A unit test does not own process main on every test harness, while Tauri
  # requires its event loop to start there.  These executable proofs
  # therefore use a real Xvfb display, a loopback page, and one supplied
  # kernal-api async runtime. They exercise matching Finished correlation,
  # actual window destruction, popup/redirect denial, timeout, cancellation,
  # and window-close revocation with zero semantic/native resources.
  tauri-webview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native webview development packages
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          dbus-x11 libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - name: Restore native pkg-config search path
        run: echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - name: Run real semantic webview lifecycle proofs
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- close
          dbus-run-session -- xvfb-run -a bash -c '
            soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- popup & proof=$!;
            for _ in $(seq 1 50); do window=$(xdotool search --name "kernal-api external-content proof" | head -1 || true); [ -n "$window" ] && break; sleep 0.1; done;
            test -n "$window"; sleep 1; xdotool mousemove --window "$window" 150 150 click 1; wait "$proof"'
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- redirect
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- timeout
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- cancel
          dbus-run-session -- xvfb-run -a soldr cargo run --locked --features tauri-webview-test-support --bin kernal-tauri-smoke -- window-close

  # Compile the two external facade consumers. Each is its own `[workspace]`
  # that depends on this crate by path with `default-features = false`, so it
  # resolves `kernal-api` the way an application does -- without this
  # workspace's dev-dependencies, lints, or sibling features. `each-feature`
  # above proves a feature compiles inside this workspace; only this lane
  # proves the opt-in surface is nameable from outside it, where a public
  # signature that needs a `running-process` type spelled out fails and
  # nowhere else. Until this job existed the consumers were read only by the
  # text scan in `tests/facade_policy.rs`, which compiles nothing.
  #
  # One job with two steps rather than a matrix: `setup-soldr` dominates the
  # cost of a `cargo check` this small, and the step names already say which
  # consumer broke. `--locked` is deliberate -- each consumer carries its own
  # lock file, so a dependency change in this crate's manifest has to be
  # reflected in both of them or this lane fails.
  facade-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - name: Check the external daemon-registration consumer
        run: >-
          soldr cargo check --locked
          --manifest-path tests/daemon-registration-consumer/Cargo.toml
      - name: Check the external daemon-registration-v2 consumer
        run: >-
          soldr cargo check --locked
          --manifest-path tests/daemon-registration-v2-consumer/Cargo.toml

  threaded-rust-artifact:
    strategy:
      fail-fast: false
      matrix:
        # macOS leaves the matrix unless `ENABLE_MACOS_RUNNERS` is `true`, so
        # the Apple lane is suppressed without deleting it.
        os: >-
          ${{ vars.ENABLE_MACOS_RUNNERS == 'true'
          && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
          || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          toolchain: 1.95.0
      - name: Build the source-only threaded guest and validate root execution (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kernal-api-threaded-smoke
        run: bash scripts/build-threaded-smoke.sh
      - name: Build the source-only threaded guest and validate root execution (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kernal-api-threaded-smoke
        shell: pwsh
        run: ./scripts/build-threaded-smoke.ps1

  wasm-abi-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          toolchain: 1.95.0
      - name: Verify checked-in guest, host, and ABI manifest generation
        run: bash ci/check_wasm_abi_generation.sh
      - name: Test the explicit ABI generator
        run: >-
          soldr cargo test --locked
          --manifest-path tools/wasm-abi-generator/Cargo.toml

  compilation-boundary-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv run --no-project ci/check_compilation_boundary_dependencies.py
      - run: uv run --no-project ci/test_release_package_features.py

  supported-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            legacy_cargo: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            legacy_cargo: true
          # Apple targets cross-compile on Linux through Soldr's own toolchain
          # (its bundled LLVM plus the managed macOS SDK), so neither Apple
          # build lane needs a macOS runner. The only Apple-hosted lanes left in
          # this workflow are `macos-arm-tests` and the macOS entry of
          # `threaded-rust-artifact`, both gated off by `ENABLE_MACOS_RUNNERS`.
          - os: ubuntu-latest
            target: x86_64-apple-darwin
            legacy_cargo: false
          - os: ubuntu-latest
            target: aarch64-apple-darwin
            legacy_cargo: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            legacy_cargo: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            legacy_cargo: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Install native webview development packages
        if: matrix.legacy_cargo
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libgtk-3-dev libwebkit2gtk-4.1-dev
      - if: matrix.legacy_cargo
        uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - if: ${{ !matrix.legacy_cargo }}
        uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          # Apple SDK preparation has no archive payload to cache.
          cache: false
          cross-targets: ${{ matrix.target }}
      - name: Restore native pkg-config search path
        if: matrix.legacy_cargo
        run: |
          echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      # These Linux runners already match their declared target. Building
      # natively lets WebKitGTK use the host ABI instead of trying to combine
      # Ubuntu libraries with Soldr's portable glibc cross sysroot.
      - if: matrix.legacy_cargo
        run: >-
          soldr cargo build
          --locked --all-features
      - if: ${{ !matrix.legacy_cargo }}
        run: >-
          soldr build
          --target ${{ matrix.target }} --all-features
      - name: Compile the explicit ABI generator for the supported target
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: >-
          soldr cargo check --locked
          --manifest-path tools/wasm-abi-generator/Cargo.toml
          --target ${{ matrix.target }}
      - name: Compile the explicit ABI generator on native Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: >-
          soldr cargo check --locked
          --manifest-path tools/wasm-abi-generator/Cargo.toml

  dylints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native webview development packages
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          toolchain: 1.95.0
          cache: true
          build-cache: false
          prebuild-deps: none
          dylint: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
      - name: Restore native pkg-config search path
        run: echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - name: Select the pinned Dylint compiler
        shell: bash
        run: |
          rustc_path="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          echo "RUSTC=${rustc_path}" >> "${GITHUB_ENV}"
          echo "RUSTUP_TOOLCHAIN=nightly-2026-05-28" >> "${GITHUB_ENV}"
          chmod +x ci/dylint-shim/cargo
          echo "${GITHUB_WORKSPACE}/ci/dylint-shim" >> "${GITHUB_PATH}"
      - name: Test facade boundary lint
        env:
          # Do not trust a partially restored global crates.io source tree.
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_boundary/Cargo.toml
      - name: Test platform boundary lint
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_platform_boundary/Cargo.toml
      # A Dylint pass only sees what the compiler compiles, and `default = []`.
      # Without `--all-features` every gated module -- `crash`, `wasm`,
      # `symbolize`, `profile`, `fs`, `ipc`, the platform watchers -- is invisible
      # to the boundary lints, so a green job would mean nothing beyond the
      # ungated core. Keep both flags: features widen the module set, targets
      # widen it to the integration tests and the two worker binaries.
      - name: Lint every client-style target
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr cargo dylint
          --all --workspace -- --all-features --all-targets

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: >-
          uv run --no-project --python ${{ matrix.python }}
          --with-editable . --with pytest pytest python/tests
      - run: uv build --clear
      - run: uv run --no-project --python ${{ matrix.python }} --with twine twine check dist/*
