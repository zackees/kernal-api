[package]
name = "kernal-api-wasm-abi-generator"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

# Warnings are errors here, as in the kernal-api workspace.
[lints.rust]
warnings = "deny"

[workspace]

# This tool is deliberately outside the published package and is invoked only
# by the explicit regeneration/check command. The immutable revision is the
# Core-Wasm backend with bounded caller-memory stream lowering accepted for #13.
[dependencies]
fp-bindgen = { git = "https://github.com/zackees/fp-bindgen.git", rev = "b8ad400", default-features = false, features = ["wasmtime-core-wasm"] }
toml = "=0.8.23"
wasmparser = { version = "=0.248.0", default-features = false }
