name: Auto-Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and upload build artifacts without publishing anything
        type: boolean
        default: true

permissions:
  contents: write
  # release.yml's jobs cancel the run when one fails; a called workflow gets
  # no more than its caller grants.
  actions: write

concurrency:
  group: kernal-api-release
  cancel-in-progress: false

jobs:
  prepare:
    # Existing-tag dispatch is the immutable registry recovery path after main advances.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Detect version bump
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BEFORE: ${{ github.event.before }}
        run: uv run --no-project --python 3.13 ci/auto_release.py

  release:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ github.sha }}
      tag: ${{ needs.prepare.outputs.tag }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit

  publish-crates:
    # Here, in the top-level workflow, rather than in release.yml: this is
    # the workflow registered as the crate's trusted publisher. `release`
    # completing means every release.yml job -- guard, validation,
    # packaging, GitHub assets -- succeeded.
    needs: [prepare, release]
    if: >-
      needs.prepare.outputs.should_release == 'true'
      && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
      && vars.PUBLISH_CRATES_IO == 'true'
    runs-on: ubuntu-latest
    environment: release
    # crates.io trusted publishing: no stored token. The job exchanges its
    # GitHub OIDC token for a short-lived crates.io token, which crates.io
    # grants only to `zackees/kernal-api`'s `auto-release.yml`.
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          lfs: true
      - uses: zackees/setup-soldr@d6a0844c40b94f62cf104377b4cc90403c96f6ce # v0.9.75
        with:
          # A release restores nothing. Every cache is a key that another job
          # can write -- the v0.1.13 aarch64 worker restored a toolchain whose
          # rustup records listed an aarch64 std that the saved archive did not
          # contain, and failed at E0463. Build from sources and releases only.
          cache: false
          build-cache: false
          # Not covered by `cache: false`: the toolchain cache is separate.
          solo-toolchain-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-packages
          path: release-packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conpty-sidecars
          path: conpty-sidecars
      - name: Stage validated ConPTY manifest for publishing
        shell: bash
        run: cp conpty-sidecars/conpty-sidecar.sha256.toml conpty-sidecar.sha256.toml
      - name: Exchange the OIDC token for a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish or verify identical crates.io artifact
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          version="${{ needs.prepare.outputs.tag }}"
          version="${version#v}"
          crate_file="$(find release-packages -name "kernal-api-${version}.crate" -print -quit)"
          local_sha="$(sha256sum "${crate_file}" | awk '{print $1}')"
          status="$(curl -sS -o crates.json -w '%{http_code}' \
            -H 'User-Agent: kernal-api-release (https://github.com/zackees/kernal-api)' \
            "https://crates.io/api/v1/crates/kernal-api/${version}")"
          if [[ "${status}" == "404" ]]; then
            soldr cargo publish --locked --no-verify --allow-dirty
          elif [[ "${status}" == "200" ]]; then
            remote_sha="$(jq -r '.version.checksum' crates.json)"
            test "${local_sha}" = "${remote_sha}"
          else
            echo "crates.io returned HTTP ${status}" >&2
            exit 1
          fi
      # A failed release job stops the whole release run.
      - name: Cancel the run (this job failed)
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
