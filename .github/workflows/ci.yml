name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  rust-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: zackees/setup-soldr@61dbee94deb0b7240a9a006a74ed04989a920303
      - if: runner.os != 'Windows'
        run: soldr cargo test --locked --all-features
      - if: runner.os == 'Windows'
        # Temporary quarantine for source-line assertions: zackees/soldr#2148.
        run: >-
          soldr cargo test --locked --all-features --
          --skip a_real_pdb_yields_file_and_line_for_this_crates_code
          --skip real_addresses_resolve_to_files_and_lines_when_asked
      - run: >-
          soldr cargo clippy
          --locked --all-features --all-targets -- --deny warnings
      - run: soldr cargo fmt --all -- --check

  each-feature:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - allocator
          - conpty-sidecar
          - crash
          - fs
          - ipc
          - ipc-async
          - profile
          - pty
          - session-relay
          - snapshot
          - symbolize
          - symbolize-worker
          - tokio-console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: zackees/setup-soldr@61dbee94deb0b7240a9a006a74ed04989a920303
      - run: >-
          soldr cargo check
          --locked --no-default-features --features ${{ matrix.feature }}

  supported-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            legacy_cargo: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            legacy_cargo: true
          - os: macos-latest
            target: x86_64-apple-darwin
            legacy_cargo: false
          - os: macos-latest
            target: aarch64-apple-darwin
            legacy_cargo: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            legacy_cargo: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            legacy_cargo: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - if: matrix.legacy_cargo
        uses: zackees/setup-soldr@61dbee94deb0b7240a9a006a74ed04989a920303
      - if: ${{ !matrix.legacy_cargo }}
        uses: zackees/setup-soldr@61dbee94deb0b7240a9a006a74ed04989a920303
        with:
          # Native Apple SDK preparation has no archive payload to cache.
          cache: false
          cross-targets: ${{ matrix.target }}
      - if: matrix.legacy_cargo && matrix.target != 'aarch64-unknown-linux-gnu'
        run: >-
          soldr cargo build
          --locked --target ${{ matrix.target }} --all-features
      # The managed GNU ARM bundle is intentionally x86_64-hosted. Until
      # Soldr distinguishes a native ARM host, validate this lane natively.
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: >-
          soldr cargo build
          --locked --all-features
      - if: ${{ !matrix.legacy_cargo }}
        run: >-
          soldr build
          --target ${{ matrix.target }} --all-features

  dylints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: zackees/setup-soldr@61dbee94deb0b7240a9a006a74ed04989a920303
        with:
          toolchain: 1.95.0
          cache: true
          build-cache: false
          prebuild-deps: none
          dylint: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
      - name: Select the pinned Dylint compiler
        shell: bash
        run: |
          rustc_path="$(soldr rustup which --toolchain nightly-2026-05-28 rustc)"
          echo "RUSTC=${rustc_path}" >> "${GITHUB_ENV}"
          echo "RUSTUP_TOOLCHAIN=nightly-2026-05-28" >> "${GITHUB_ENV}"
          chmod +x ci/dylint-shim/cargo
          echo "${GITHUB_WORKSPACE}/ci/dylint-shim" >> "${GITHUB_PATH}"
      - name: Test facade boundary lint
        env:
          # Do not trust a partially restored global crates.io source tree.
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_boundary/Cargo.toml
      - name: Test platform boundary lint
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr rustup run
          nightly-2026-05-28 cargo test
          --manifest-path dylints/kernal_api_platform_boundary/Cargo.toml
      - name: Lint every client-style target
        env:
          CARGO_HOME: ${{ runner.temp }}/kernal-dylint-cargo
        run: >-
          soldr cargo dylint
          --all --workspace -- --all-targets

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: >-
          uv run --no-project --python ${{ matrix.python }}
          --with-editable . --with pytest pytest python/tests
      - run: uv build --clear
      - run: uv run --no-project --python ${{ matrix.python }} --with twine twine check dist/*
