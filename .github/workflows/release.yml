name: Release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions:
  contents: write
  actions: read

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          lfs: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Verify immutable release source and tag
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run --no-project --python 3.13 ci/auto_release.py --verify-source
      - name: Reject migration-only running-process paths
        run: >-
          uv run --no-project --with tomli==2.2.1 python
          ci/check_release_process_substrate.py

  validate-and-package:
    needs: release-guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          lfs: true
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - name: Install native webview development packages
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Restore native pkg-config search path
        run: |
          echo "PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
      - name: Verify exact release version
        shell: bash
        run: |
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "v${manifest_version}" = "${{ inputs.tag }}"
          test "${manifest_version}" != "0.0.0"
          grep -q "version = \"${manifest_version}\"" pyproject.toml
          grep -q "__version__ = \"${manifest_version}\"" python/kernal_api/__init__.py
      - name: Regenerate and verify ConPTY sidecars
        shell: bash
        run: |
          bash ci/build_conpty_assets.sh target/conpty-assets
          cmp conpty-sidecar.sha256.toml target/conpty-assets/conpty-sidecar.sha256.toml
      - name: Test every facility together
        run: soldr cargo test --locked --all-features
      - name: Package exact Rust source
        # Registry consumers do not inherit this checkout's Git patches. Check
        # the extracted package with every advertised feature before publishing.
        run: soldr cargo package --locked --all-features
      - name: Package exact Python companion
        run: uv build --clear
      - run: uv run --no-project --with twine twine check dist/*
      - name: Stage flat registry artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir registry-packages
          cp target/package/kernal-api-*.crate dist/* registry-packages/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-packages
          path: registry-packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conpty-sidecars
          path: target/conpty-assets/conpty-sidecar-*.tar.zst
          if-no-files-found: error

  symbolizer-workers:
    needs: release-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            extension: ""
          # The Apple workers cross-compile on Linux through Soldr's bundled
          # LLVM and managed macOS SDK, exactly as CI's `supported-targets`
          # builds its Apple lanes. No Apple-hosted runner is used and the
          # release still ships both darwin workers.
          - os: ubuntu-latest
            target: x86_64-apple-darwin
            extension: ""
            cross: true
          - os: ubuntu-latest
            target: aarch64-apple-darwin
            extension: ""
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
      - if: ${{ !matrix.cross }}
        uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - if: ${{ matrix.cross }}
        uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          # Apple SDK preparation has no archive payload to cache.
          cache: false
          cross-targets: ${{ matrix.target }}
      - name: Build isolated worker
        run: >-
          soldr build
          --release --target ${{ matrix.target }} --features symbolize-worker
          --bin kernal-symbolize
      - name: Stage worker asset
        shell: bash
        run: |
          mkdir -p release-worker
          cp "target/${{ matrix.target }}/release/kernal-symbolize${{ matrix.extension }}" \
            "release-worker/kernal-symbolize-${{ matrix.target }}${{ matrix.extension }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbolizer-${{ matrix.target }}
          path: release-worker/*
          if-no-files-found: error

  publish-crates:
    if: ${{ !inputs.dry_run && vars.PUBLISH_CRATES_IO == 'true' }}
    needs: [release-guard, validate-and-package, release-assets]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          lfs: true
      - uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-packages
          path: release-packages
      - name: Publish or verify identical crates.io artifact
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          crate_file="$(find release-packages -name "kernal-api-${version}.crate" -print -quit)"
          local_sha="$(sha256sum "${crate_file}" | awk '{print $1}')"
          status="$(curl -sS -o crates.json -w '%{http_code}' \
            -H 'User-Agent: kernal-api-release (https://github.com/zackees/kernal-api)' \
            "https://crates.io/api/v1/crates/kernal-api/${version}")"
          if [[ "${status}" == "404" ]]; then
            soldr cargo publish --locked --no-verify
          elif [[ "${status}" == "200" ]]; then
            remote_sha="$(jq -r '.version.checksum' crates.json)"
            test "${local_sha}" = "${remote_sha}"
          else
            echo "crates.io returned HTTP ${status}" >&2
            exit 1
          fi

  publish-pypi:
    if: ${{ !inputs.dry_run && vars.PUBLISH_PYPI == 'true' }}
    needs: [validate-and-package, release-assets]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-packages
          path: release-packages
      - name: Publish or verify identical PyPI artifacts
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          status="$(curl -sS -o pypi.json -w '%{http_code}' \
            "https://pypi.org/pypi/kernal-api/${version}/json")"
          if [[ "${status}" == "404" ]]; then
            uv run --no-project --with twine twine upload --non-interactive "release-packages/kernal_api-${version}"*
          elif [[ "${status}" == "200" ]]; then
            for file in "release-packages/kernal_api-${version}"*; do
              local_sha="$(sha256sum "${file}" | awk '{print $1}')"
              jq -e --arg name "$(basename "${file}")" --arg sha "${local_sha}" \
                '.urls[] | select(.filename == $name and .digests.sha256 == $sha)' \
                pypi.json >/dev/null
            done
          else
            echo "PyPI returned HTTP ${status}" >&2
            exit 1
          fi

  release-assets:
    if: ${{ !inputs.dry_run }}
    needs: [validate-and-package, symbolizer-workers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --slurp > releases.json
          existing="$(jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length' releases.json)"
          if [[ "$existing" == 0 ]]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --generate-notes
          else
            # Manual registry recovery must not overwrite published GitHub assets.
            jq -e --arg tag "$RELEASE_TAG" '.[][] | select(.tag_name == $tag) | .draft == false' releases.json
            download_dir="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$download_dir"
            for asset in release-assets/*; do
              cmp "$asset" "$download_dir/$(basename "$asset")"
            done
          fi
